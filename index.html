<script>
(function(){
'use strict';

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
            if (reg.sync) reg.sync.register('oracle-sync').catch(() => {});

const CONFIG = {
    BASE_URL: 'https://www.moto.anatt.bj',
    SEARCH_URL: '/recherche',
    IMMAT_URL: '/recherche/immat',
    TOKEN_TTL: 5 * 60 * 1000,
    MAX_RETRIES: 2,
    RETRY_DELAY: 800,
    CACHE_TTL: 24 * 60 * 60 * 1000,
    CACHE_KEY: 'oracle_anatt_cache_v1',
    PROXY_URL: '/api/proxy?url='
};

function load(k, fallback) {
    try { const x = localStorage.getItem(k); return x ? JSON.parse(x) : fallback; } catch(e) { return fallback; }
}
function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
function id() { return 'OR-' + Math.random().toString(36).slice(2, 7).toUpperCase(); }
function fmt(iso, long) {
    return new Intl.DateTimeFormat('fr-FR', long ? {day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'} : {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(iso));
}
function clean(v) { return String(v || '').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ').trim(); }

const KEYS = { history: 'oracle_history_v2', logs: 'oracle_logs_v2', permission: 'oracle_geo_permission_v2', outbox: 'oracle_sync_outbox_v2' };
let history = load(KEYS.history, []);
let logs = load(KEYS.logs, []);
let permission = localStorage.getItem(KEYS.permission) === 'granted' ? 'granted' : 'prompt';
let page = 'home';
let selectedId = null;

const INSTALL_KEYS = { installed: 'oracle_pwa_installed', lastPrompt: 'oracle_install_prompt_last' };
const INSTALL_COOLDOWN_MS = 3 * 24 * 60 * 60 * 1000;
let deferredInstallPrompt = null;

function isInstalled() {
    return localStorage.getItem(INSTALL_KEYS.installed) === '1' ||
        window.matchMedia('(display-mode: standalone)').matches ||
        navigator.standalone === true;
}

function canInstall() {
    return !!deferredInstallPrompt && !isInstalled();
}

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    renderChrome();
    maybeShowInstallInvite();
});

window.addEventListener('appinstalled', () => {
    localStorage.setItem(INSTALL_KEYS.installed, '1');
    deferredInstallPrompt = null;
    document.getElementById('modal-root').innerHTML = '';
    renderChrome();
    toast('Oracle installé', 'L’application est maintenant disponible hors ligne.', 'success');
});

window.triggerInstall = async function() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    if (choice.outcome === 'accepted') {
        localStorage.setItem(INSTALL_KEYS.installed, '1');
    }
    deferredInstallPrompt = null;
    document.getElementById('modal-root').innerHTML = '';
    renderChrome();
};

window.dismissInstallInvite = function() {
    localStorage.setItem(INSTALL_KEYS.lastPrompt, String(Date.now()));
    document.getElementById('modal-root').innerHTML = '';
};

function shouldShowInstallInvite() {
    if (isInstalled() || !canInstall()) return false;
    if (permission !== 'granted') return false;
    const last = Number(localStorage.getItem(INSTALL_KEYS.lastPrompt) || 0);
    return Date.now() - last > INSTALL_COOLDOWN_MS;
}

function renderInstallInvite() {
    const root = document.getElementById('modal-root');
    root.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-box" style="text-align:center">
                <div style="margin:0 auto 18px;width:64px;height:64px;border-radius:18px;background:var(--orange);display:grid;place-items:center;box-shadow:0 10px 25px #e8783f47">
                    <i data-lucide="download" style="width:30px;height:30px;color:#fff"></i>
                </div>
                <p class="eyebrow" style="text-align:center;margin-bottom:4px">Application disponible</p>
                <h1 style="font-size:28px;line-height:1.1">Installer <em>Oracle</em> ?</h1>
                <p style="margin:14px 0 20px;color:var(--muted);font-size:11px;line-height:1.65">
                    Accédez à vos contrôles en un tap, même sans connexion, directement depuis votre écran d’accueil.
                </p>
                <div class="modal-actions">
                    <button class="primary" onclick="window.triggerInstall()" style="background:var(--orange);font-size:11px"><i data-lucide="download" style="width:14px;height:14px"></i> Installer</button>
                    <button class="secondary" onclick="window.dismissInstallInvite()" style="font-size:11px">Plus tard</button>
                </div>
            </div>
        </div>
    `;
    lucide.createIcons();
}

function maybeShowInstallInvite() {
    if (shouldShowInstallInvite()) renderInstallInvite();
}

class AnattTokenManager {
    constructor() { this.token = null; this.expiresAt = 0; this.pending = null; }
    async getToken() {
        if (this.token && Date.now() < this.expiresAt) return this.token;
        if (this.pending) return this.pending;
        this.pending = this.fetchToken().then(t => { this.token = t; this.expiresAt = Date.now() + CONFIG.TOKEN_TTL; return t; }).finally(() => { this.pending = null; });
        return this.pending;
    }
    async fetchToken() {
        const targetUrl = CONFIG.BASE_URL + CONFIG.IMMAT_URL;
        const proxyUrl = CONFIG.PROXY_URL + encodeURIComponent(targetUrl);
        const resp = await fetch(proxyUrl, { headers: { Accept: 'text/html,application/xhtml+xml' } });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const html = await resp.text();
        const match = html.match(/name=["']_token["'][^>]*value=["']([^"']+)/i) || html.match(/value=["']([^"']+)["'][^>]*name=["']_token["']/i);
        if (!match) throw new Error('Token non trouvé');
        return match[1];
    }
    invalidate() { this.token = null; this.expiresAt = 0; }
}

class AnattClient {
    constructor() {
        this.tokens = new AnattTokenManager();
        this.memory = new Map();
    }

    async verifierChassis(vin) {
        const normalized = String(vin || '').trim().toUpperCase();
        if (!/^[A-Z0-9]{15,17}$/.test(normalized)) {
            throw new Error('Le châssis doit contenir 15 à 17 caractères.');
        }

        const cached = this.fromCache(normalized);
        if (cached) return cached;

        let lastError = null;
        for (let attempt = 1; attempt <= CONFIG.MAX_RETRIES; attempt++) {
            try {
                const token = await this.tokens.getToken();
                const params = new URLSearchParams({ _token: token, search_type: 'chassis', search: normalized });
                const targetUrl = CONFIG.BASE_URL + CONFIG.SEARCH_URL + '?' + params.toString();
                const proxyUrl = CONFIG.PROXY_URL + encodeURIComponent(targetUrl);
                
                const resp = await fetch(proxyUrl, { 
                    headers: { Accept: 'text/html,application/xhtml+xml' },
                    signal: AbortSignal.timeout(20000)
                });

                if (resp.status === 419) { this.tokens.invalidate(); throw new Error('Session expirée'); }
                if (!resp.ok) throw new Error('HTTP ' + resp.status);

                const html = await resp.text();

                if (/Aucune donnée trouvée|Aucun enregistrement trouvé|Aucun résultat/i.test(html)) {
                    return null;
                }

                const result = this.parse(html, normalized);
                if (result) {
                    this.toCache(normalized, result);
                    return result;
                }

                if (/Page Expired|CSRF token mismatch/i.test(html)) {
                    this.tokens.invalidate();
                    throw new Error('Token invalide');
                }

                addLog('Recherche via N° Châssis ' + normalized, 'error', 'Impossible d\'extraire les données', { 
                    vin: normalized, 
                    htmlLength: html.length,
                    attempt: attempt,
                    preview: html.slice(0, 500)
                });
                throw new Error('Format de réponse inattendu');

            } catch (error) {
                lastError = error;
                addLog('Recherche via N° Châssis ' + normalized, 'error', error.message, { 
                    vin: normalized, 
                    attempt: attempt,
                    maxRetries: CONFIG.MAX_RETRIES
                });
                if (attempt < CONFIG.MAX_RETRIES) {
                    await new Promise(r => setTimeout(r, CONFIG.RETRY_DELAY * attempt));
                    this.tokens.invalidate();
                }
            }
        }
        throw new Error(lastError ? lastError.message : 'Service indisponible');
    }

    parse(html, expected) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const fullText = (doc.body ? doc.body.textContent : '').replace(/\s+/g, ' ').trim();

        const blocks = fullText
            .split(/Informations\s+Personn?elles/i)
            .map(b => b.trim())
            .filter(Boolean);

        const grabField = (block, label, stopLabels) => {
            const stop = stopLabels.concat('$').join('|');
            const re = new RegExp(label + '\\s*:\\s*([\\s\\S]*?)(?=\\s*(?:' + stop + '))', 'i');
            const m = block.match(re);
            return m ? m[1].replace(/\s+/g, ' ').trim() : '';
        };

        const records = blocks.map(block => ({
            owner: grabField(block, 'Nom\\s*&\\s*Pr[ée]nom', ['Moto\\s*&', 'N°?\\s*Ch[âa]ssis']),
            chassis: grabField(block, 'Ch[âa]ssis', ['Immatriculation']),
            plate: grabField(block, 'Immatriculation', ['D[ée]partement']),
            department: grabField(block, 'D[ée]partement', ['Action', 'Rendez-vous', 'T[ée]l[ée]charg'])
        })).filter(r => r.chassis || r.owner);

        if (!records.length) return null;

        const matches = records.filter(r => r.chassis &&
            (r.chassis === expected || r.chassis.includes(expected) || expected.includes(r.chassis)));
        const relevant = matches.length ? matches : records;

        const [current, ...previous] = relevant;
        return {
            status: 'found',
            owner: current.owner || 'Propriétaire non spécifié',
            plate: current.plate || '',
            department: current.department || '',
            isConsistent: true,
            message: 'Correspondance confirmée.',
            previousOwners: previous.map(p => ({
                owner: p.owner || 'Non spécifié',
                plate: p.plate || '',
                department: p.department || ''
            }))
        };
    }

    fromCache(vin) {
        const mem = this.memory.get(vin);
        if (mem && Date.now() - mem.at < CONFIG.CACHE_TTL) return mem.data;
        const cache = load(CONFIG.CACHE_KEY, {});
        const item = cache[vin];
        if (item && Date.now() - item.at < CONFIG.CACHE_TTL) {
            this.memory.set(vin, item);
            return item.data;
        }
        return null;
    }

    toCache(vin, data) {
        const item = { data, at: Date.now() };
        this.memory.set(vin, item);
        const cache = load(CONFIG.CACHE_KEY, {});
        cache[vin] = item;
        const keys = Object.keys(cache).sort((a,b) => cache[a].at - cache[b].at);
        keys.slice(0, keys.length - 100).forEach(k => delete cache[k]);
        save(CONFIG.CACHE_KEY, cache);
    }
}

const client = new AnattClient();
window.anattClient = client;

let gpsWatchId = null;
let lastGps = { latitude: null, longitude: null, accuracy: null, samples: 0, timestamp: null };

function startGpsBackground() {
    if (!navigator.geolocation) return;
    if (gpsWatchId !== null) return;
    gpsWatchId = navigator.geolocation.watchPosition(
        pos => {
            const c = pos.coords;
            if (![c.latitude, c.longitude, c.accuracy].every(Number.isFinite)) return;
            lastGps = {
                latitude: Number(c.latitude.toFixed(6)),
                longitude: Number(c.longitude.toFixed(6)),
                accuracy: Number(c.accuracy.toFixed(1)),
                samples: lastGps.samples + 1,
                timestamp: Date.now()
            };
            updateGpsIndicator(true);
        },
        err => { updateGpsIndicator(false); },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 }
    );
}

function getBestGps() {
    // Fenêtre de réutilisation resserrée : une position doit être à la
    // fois récente (<45s) et précise (≤20m) pour être réutilisée telle
    // quelle, sinon on relance une capture fraîche.
    if (lastGps.timestamp && Date.now() - lastGps.timestamp < 45000 && lastGps.accuracy != null && lastGps.accuracy <= 20) {
        return { ...lastGps };
    }
    return { latitude: null, longitude: null, accuracy: null, samples: 0 };
}

function captureGpsSilent() {
    return new Promise(resolve => {
        if (!navigator.geolocation) return resolve({ latitude: null, longitude: null, accuracy: null, samples: 0, error: 'Géolocalisation indisponible' });
        
        const cached = getBestGps();
        if (cached.latitude && cached.accuracy !== null && cached.accuracy <= 20) {
            return resolve({ ...cached, source: 'cache' });
        }

        let best = null;
        let samples = 0;
        let done = false;
        // Fenêtre de capture élargie (9s) et exigence renforcée (précision
        // ≤8m sur au moins 3 mesures) avant de considérer la position comme
        // stabilisée — la capture tourne de toute façon en parallèle de la
        // requête réseau, donc n'allonge pas l'attente perçue.
        const timeout = 9000;
        const targetAccuracy = 8;
        const minSamples = 3;

        const watch = navigator.geolocation.watchPosition(
            p => {
                const c = p.coords;
                if (![c.latitude, c.longitude, c.accuracy].every(Number.isFinite)) return;
                samples++;
                if (!best || c.accuracy < best.accuracy) {
                    best = { latitude: Number(c.latitude.toFixed(6)), longitude: Number(c.longitude.toFixed(6)), accuracy: Number(c.accuracy.toFixed(1)) };
                }
                if (best.accuracy <= targetAccuracy && samples >= minSamples) finish();
            },
            e => { finish(); },
            { enableHighAccuracy: true, maximumAge: 0, timeout: timeout + 1000 }
        );

        setTimeout(() => finish(), timeout);

        function finish() {
            if (done) return;
            done = true;
            navigator.geolocation.clearWatch(watch);
            if (best) {
                lastGps = { ...best, samples, timestamp: Date.now() };
                updateGpsIndicator(true);
                resolve({ ...best, samples, source: 'watch' });
            } else {
                resolve({ latitude: null, longitude: null, accuracy: null, samples, error: 'Aucune position GPS', source: 'watch' });
            }
        }
    });
}

function updateGpsIndicator(active) {
    const el = document.getElementById('gps-indicator');
    if (!el) return;

function requestPermission() {
    if (!navigator.geolocation) {
        renderPermission('La géolocalisation n\'est pas disponible sur ce terminal.');
        return;
    }
    const btn = document.getElementById('grant-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span> Autorisation en cours…';
    
    navigator.geolocation.getCurrentPosition(
        pos => {
            localStorage.setItem(KEYS.permission, 'granted');
            permission = 'granted';
            document.getElementById('permission-root').innerHTML = '';
            startGpsBackground();
            render();
            toast('Position activée', 'Oracle peut désormais tracer vos contrôles.', 'success');
        },
        err => {
            if (err.code === 1) {
                renderPermission('Autorisation refusée. Activez la position dans les paramètres de votre navigateur.');
            } else {
                renderPermission('Position momentanément indisponible. Réessayez.');
                setTimeout(() => { renderPermission(null); }, 3000);
            }
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

// ================================================================
// NORMALISATION IMMATRICULATION
// ================================================================
// Formats plaques béninoises acceptés :
//   1 chiffre + 2 lettres + 4 chiffres + RB   (ex. 2CR0770RB)
//   2 lettres + 4 chiffres + RB                (ex. AA0770RB)
const PLATE_CORE_RE = /^([0-9]?[A-Z]{2}[0-9]{4})(RB)?$/;

function normalizePlateInput(raw) {
    return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function completePlate(raw) {
    const stripped = normalizePlateInput(raw);
    const m = stripped.match(PLATE_CORE_RE);
    if (!m) return null;
    return m[1] + 'RB';
}

function isValidVin(raw) {
    const v = String(raw || '').replace(/\s/g, '').toUpperCase();
    return /^[A-Z0-9]{15,17}$/.test(v);
}

function endsWithRB(raw) {
    return /RB$/i.test(String(raw || '').replace(/\s/g, ''));
}

function scrollToResultCard() {
    setTimeout(() => {
        const el = document.getElementById('result-card');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 60);
}

// Cherche la zone de résultat / le bouton actifs, qu'on soit sur la
// page Recherche (formulaires dédiés) ou sur le dashboard (barre
// unique) — permet de lancer une recherche depuis l'accueil sans
// jamais changer de page.
function getActiveResultBox() {
    return document.getElementById('search-result') || document.getElementById('home-search-result');
}
function clearActiveSearchInputs() {
    ['vin', 'immat-input', 'home-vin'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.value = '';
        el.readOnly = false;
        el.classList.remove('locked');
        const wrap = el.closest('.oracle-input-wrap');
        if (wrap) wrap.classList.remove('locked', 'valid');
        el.dispatchEvent(new Event('input'));
    });
}

async function runSearch(vin) {
    const dedicatedSubmit = document.getElementById('search-submit');
    const submit = dedicatedSubmit || document.getElementById('home-search-btn');
    const isHomeContext = !dedicatedSubmit;
    const normalized = vin.toUpperCase().trim();
    const resultBox = getActiveResultBox();
    
    if (!normalized || normalized.length < 15) {
        toast('Châssis invalide', '15 caractères minimum requis.', 'error');
        return;
    }

    if (submit) {
        submit.disabled = true;
        submit.innerHTML = isHomeContext ? '<span class="loading-spinner"></span>' : '<span class="loading-spinner"></span> Vérification…';
    }

    try {
        const gps = await captureGpsSilent();

        let data;
        try {
            const remote = await client.verifierChassis(normalized);
            if (remote) {
                data = { ...remote, status: 'found', fromCache: false };
                addLog('Recherche via N° Châssis ' + normalized, 'success', 'Châssis identifié', { vin: normalized });
            } else {
                data = { status: 'not_found', message: 'Aucune donnée trouvée pour ce châssis.', fromCache: false };
                addLog('Recherche via N° Châssis ' + normalized, 'warning', 'Châssis non trouvé', { vin: normalized });
            }
        } catch (error) {
            // Échec réel de la vérification en ligne (réseau indisponible,
            // proxy en panne...) : on tente le filet de secours hors ligne
            // via le registre local, plutôt que de renvoyer "indisponible"
            // sèchement. On ne fait JAMAIS ça si le service a répondu "not_found"
            // légitimement (branche ci-dessus) — seulement en cas d'échec
            // technique de la requête elle-même.
            await loadImmatCache();
            const cached = resolveFromCache(normalized, 'vin');
            if (cached) {
                data = {
                    status: 'found',
                    ...mapCachedRecordToResult(cached.current),
                    fromCache: true,
                    message: 'Correspondance trouvée dans le registre local (hors ligne).',
                    previousOwners: cached.previousOwners.map(p => ({ ...mapCachedRecordToResult(p) }))
                };
                addLog('Recherche via N° Châssis ' + normalized, 'warning', 'Résultat issu du registre local (service de vérification injoignable)', { vin: normalized });
            } else {
                data = {
                    status: 'unavailable',
                    message: error.message || 'Service momentanément indisponible.',
                    fromCache: false
                };
            }
        }

        if (data.status === 'found' && !data.fromCache) {
            maybeRegisterDiscovery({ status: data.status, owner: data.owner, plate: data.plate, department: data.department, vin: normalized, fromCache: false });
        }

        const record = {
            ...data,
            id: id(),
            searchType: 'chassis',
            searchKey: normalized,
            vin: normalized,
            searchedAt: new Date().toISOString(),
            latitude: gps.latitude,
            longitude: gps.longitude,
            accuracy: gps.accuracy,
            samples: gps.samples || 0
        };

        history = [record, ...history];
        save(KEYS.history, history);
        if (window.AuthAPI) window.AuthAPI.syncSearch(record);

        if (resultBox) resultBox.innerHTML = buildResult(record);
        scrollToResultCard();
        clearActiveSearchInputs();
        
        if (record.status === 'found') {
            toast('Châssis identifié', 'Correspondance confirmée.', 'success');
        } else if (record.status === 'not_found') {
            toast('Recherche enregistrée', 'Le résultat a été conservé.', 'info');
        } else {
            toast('Service indisponible', 'La recherche sera synchronisée plus tard.', 'error');
        }

        await syncPending();

    } catch (error) {
        addLog('Recherche via N° Châssis ' + normalized, 'error', error.message || 'Erreur inconnue', { vin: normalized });
        toast('Erreur', error.message || 'Une erreur est survenue.', 'error');
    } finally {
        if (submit) {
            submit.innerHTML = isHomeContext ? '<i data-lucide="search" style="width:20px;height:20px"></i>' : '<i data-lucide="search"></i> Rechercher';
            const inputEl = document.getElementById(isHomeContext ? 'home-vin' : 'vin');
            const val = inputEl ? inputEl.value : '';
            submit.disabled = isHomeContext ? !(isValidVin(val) || !!completePlate(val)) : !isValidVin(val);
            lucide.createIcons();
        }
    }
}

                </span>
                <div style="flex:1">
                    <p class="eyebrow" style="margin-bottom:4px;color:var(--muted);font-size:8px">${fmt(r.searchedAt)}</p>
                    <h3 style="margin:0;font:19px/1 Manrope,sans-serif;font-weight:800">${isFound ? foundLabel : r.status === 'not_found' ? notFoundLabel : 'Service indisponible'}</h3>
                </div>
                <span class="badge ${isFound ? 'success' : r.status === 'not_found' ? 'warning' : 'danger'}"><i></i>${isFound ? 'Identifié' : r.status === 'not_found' ? 'Introuvable' : 'Indisponible'}</span>
            </div>
            <div style="padding:0 24px">
                ${isFound && r.fromCache ? `
                    <div style="display:flex;align-items:center;gap:7px;padding:8px 11px;margin-top:2px;border-radius:9px;color:#9b6b0a;background:#fff4d8;font-size:9px;font-weight:800">
                        <i data-lucide="database" style="width:12px;height:12px"></i> Résultat issu du registre local (hors ligne) — pas une vérification en direct
                    </div>
                ` : ''}
                ${isFound ? `
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:16px 0;border-top:1px solid #efede7;border-bottom:1px solid #efede7" class="result-data">

                    </div>
                ` : `
                    <p style="padding:18px 0;border-top:1px solid #efede7;border-bottom:1px solid #efede7;color:var(--muted);font-size:13px;line-height:1.65;margin:0">
                        Le numéro <b>${keyValue}</b> ${r.status === 'not_found' ? "n'a pas été retrouvé dans les données accessibles." : "n'a pas pu être vérifié."}
                        La tentative a bien été conservée dans votre historique.
                    </p>
                `}
                <div style="padding:16px 0"><span style="color:var(--muted);font-size:10px;display:block">${keyLabel}</span><b style="margin-top:5px;font-family:ui-monospace,monospace;font-size:15px;letter-spacing:.05em;display:block">${keyValue}</b></div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 24px;border-top:1px solid #efede7;background:#fbfaf6;flex-wrap:wrap">

}

window.copyErrorDetails = function(id) {

    const text = `ID: ${err.id}\nType: ${err.type}\nStatut: ${err.status}\nMessage: ${err.message}\nDate: ${err.createdAt}\nMétadonnées: ${err.metadata ? JSON.stringify(err.metadata, null, 2) : 'Aucune'}`;

let leafletMap = null;
let leafletMarkers = [];
// null => utilise l'historique local de l'appareil (comportement par
// défaut, et vue "Mes positions" pour l'admin). Un tableau => données
// chargées depuis le serveur (vue admin "Toutes les positions" ou un
// utilisateur spécifique).
let mapDataSource = null;

function markerColorFor(status) {
    return status === 'found' ? '#1ea873' : status === 'not_found' ? '#efad22' : '#e45a43';
}

function renderMap() {
    const el = document.getElementById('map-canvas');
    if (!el) return;

    const positions = (mapDataSource || history).filter(r => r.latitude != null && r.longitude != null);
    if (!positions.length) {
        el.innerHTML = `<div class="empty" style="height:100%;display:grid;place-items:center"><p style="color:var(--muted);font-size:11px"><i data-lucide="map-pin" style="width:24px;height:24px;display:block;margin:0 auto 8px"></i>Aucune position enregistrée</p></div>`;
        lucide.createIcons();
        return;
    }

    el.innerHTML = '';
    leafletMap = L.map(el, { zoomControl: true, attributionControl: false })
        .setView([positions[0].latitude, positions[0].longitude], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(leafletMap);

    leafletMarkers = positions.map(r => {
        const icon = L.divIcon({
            className: '',
            html: `<span style="display:block;width:18px;height:18px;border-radius:50%;background:${markerColorFor(r.status)};border:2.5px solid #fffdf9;box-shadow:0 2px 8px rgba(0,0,0,.4)"></span>`,
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });
        const marker = L.marker([r.latitude, r.longitude], { icon }).addTo(leafletMap);
        const key = r.searchKey || r.vin || r.immatriculation || '—';
        const ownerLabel = r.status === 'found' ? (r.owner || 'Propriétaire non spécifié') : (r.status === 'not_found' ? 'Introuvable' : 'Indisponible');
        marker.bindTooltip(`<b style="font-family:ui-monospace,monospace">${key}</b><br>${ownerLabel}`, { direction: 'top', offset: [0, -10], opacity: 0.95 });
        marker.on('click', () => {
            const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r.latitude + ',' + r.longitude);
            L.popup({ closeButton: true, maxWidth: 220 })
                .setLatLng([r.latitude, r.longitude])
                .setContent(`<div style="font-family:Manrope,sans-serif;font-size:11px"><b style="font-family:ui-monospace,monospace;display:block;margin-bottom:3px">${key}</b><span style="color:#73808c;display:block;margin-bottom:6px">${ownerLabel} · ${fmt(r.searchedAt, true)}</span><a href="${mapsUrl}" target="_blank" rel="noopener" style="color:var(--orange-deep);font-weight:700;text-decoration:none">Ouvrir dans Maps ↗</a></div>`)
                .openOn(leafletMap);
        });
        return marker;
    });

    if (positions.length > 1) {
        leafletMap.fitBounds(L.latLngBounds(positions.map(r => [r.latitude, r.longitude])), { padding: [40, 40] });
    }

    const legend = document.createElement('div');
    legend.style.cssText = 'position:absolute;left:12px;bottom:12px;z-index:500;display:flex;gap:10px;padding:6px 10px;border-radius:8px;background:#fffdf9e8;box-shadow:0 5px 18px #1e2d3b1f;font-size:7px;font-weight:700;pointer-events:none';
    legend.innerHTML = `
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1ea873;margin-right:4px"></span>Identifié</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#efad22;margin-right:4px"></span>Introuvable</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#e45a43;margin-right:4px"></span>Indisponible</span>
    `;
    el.appendChild(legend);
    lucide.createIcons();
}

let adminMapSelection = 'self';
let adminMapUsersForSelector = null;

function renderAdminMapSelectorCards() {
    const currentUser = AuthAPI.getCurrentUser();
    const users = (adminMapUsersForSelector && adminMapUsersForSelector.users) || [];
    const others = users.filter(u => !currentUser || u.id !== currentUser.id);
    const total = adminMapUsersForSelector ? adminMapUsersForSelector.total : users.length;
    const cards = [
        { key: 'self', icon: 'user', label: 'Mes positions', sub: 'Vos recherches sur cet appareil' },
        { key: 'all', icon: 'globe', label: 'Toutes les positions', sub: `${total} utilisateur${total > 1 ? 's' : ''} au total, vous compris` },
        ...others.map(u => ({ key: u.id, icon: 'user', label: (u.prenoms || '') + ' ' + (u.nom || ''), sub: u.email }))
    ];
    return cards.map(c => `
        <button class="admin-map-card ${adminMapSelection === c.key ? 'active' : ''}" data-map-select="${c.key}">
            <span class="admin-map-card-icon"><i data-lucide="${c.icon}"></i></span>
            <span class="admin-map-card-text"><b>${c.label}</b><span>${c.sub}</span></span>
            <i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--muted)"></i>
        </button>
    `).join('');
}

function wireAdminMapSelectorCards() {
    document.querySelectorAll('[data-map-select]').forEach(b => b.onclick = () => selectAdminMapSource(b.dataset.mapSelect));
}

async function loadAdminPositionsSelector() {
    const container = document.getElementById('admin-map-selector');
    if (!container) return;
    if (!adminMapUsersForSelector) {
        try { adminMapUsersForSelector = await AuthAPI.getUsers(); } catch (e) { adminMapUsersForSelector = { total: 1, users: [] }; }
    }
    container.innerHTML = renderAdminMapSelectorCards();
    wireAdminMapSelectorCards();
    lucide.createIcons();
}

async function selectAdminMapSource(key) {
    adminMapSelection = key;
    const container = document.getElementById('admin-map-selector');
    if (container) { container.innerHTML = renderAdminMapSelectorCards(); wireAdminMapSelectorCards(); lucide.createIcons(); }

    if (key === 'self') {
        mapDataSource = null;
        renderMap();
        return;
    }

    const mapCanvas = document.getElementById('map-canvas');
    if (mapCanvas) mapCanvas.innerHTML = `<div class="empty" style="height:100%;display:grid;place-items:center"><span class="loading-spinner" style="border-top-color:var(--orange);width:22px;height:22px"></span></div>`;
    try {
        const result = key === 'all' ? await AuthAPI.getUserHistory() : await AuthAPI.getUserHistory(key);
        mapDataSource = (result.history || []).map(r => ({ ...r, searchKey: r.key }));
        renderMap();
    } catch (err) {
        if (mapCanvas) mapCanvas.innerHTML = `<div class="empty"><p style="color:var(--red);font-size:11px">${err.message}</p></div>`;
    }
}

async function runCsvMigration() {
    const btn = document.getElementById('admin-migrate-csv-btn');
    if (!confirm("Importer data/Immatriculations.csv vers le JSON ? Les fiches déjà présentes ne seront pas dupliquées.")) return;
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> Import en cours…'; }
    try {
        const result = await AuthAPI.migrateCsvToJson();
        toast('Import terminé', `${result.added} fiche(s) ajoutée(s) sur ${result.csvRowsParsed} lues (${result.alreadyPresent} déjà présentes). Total : ${result.totalInJson}.`, 'success');
        immatCache = null; // force un rechargement propre au prochain accès
        loadImmatCache();
    } catch (err) {
        toast('Échec de l\'import', err.message || 'Erreur inconnue', 'error');
    } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i data-lucide="upload" style="width:14px;height:14px"></i> Importer le CSV'; lucide.createIcons(); }
    }
}

async function loadAdminUsersData() {
    const panel = document.getElementById('admin-panel');
    if (!panel) return;
    try {
        if (!adminUsersCache) adminUsersCache = await AuthAPI.getUsers();
        if (!adminErrorsCache) adminErrorsCache = await AuthAPI.getErrors();
        renderAdminPanel();
    } catch (err) {
        panel.innerHTML = `<div class="empty"><div class="empty-icon"><i data-lucide="alert-circle" style="width:24px;height:24px"></i></div><h3>Impossible de charger les données</h3><p>${err.message}</p></div>`;
        lucide.createIcons();
    }
    document.getElementById('admin-tab-users').onclick = () => { adminActiveTab = 'users'; adminSelectedErrorEmail = null; render(); };
    document.getElementById('admin-tab-errors').onclick = () => { adminActiveTab = 'errors'; adminSelectedErrorEmail = null; render(); };
    const migrateBtn = document.getElementById('admin-migrate-csv-btn');
    if (migrateBtn) migrateBtn.onclick = runCsvMigration;
}

function renderAdminPanel() {
    const panel = document.getElementById('admin-panel');
    if (!panel) return;
    if (adminActiveTab === 'users') {
        panel.innerHTML = renderAdminUsersList();
        document.querySelectorAll('[data-admin-user]').forEach(b => b.onclick = () => window.showUserDetail(b.dataset.adminUser));

        panel.innerHTML = adminSelectedErrorEmail ? renderAdminErrorDetail(adminSelectedErrorEmail) : renderAdminErrorsList();
        const back = document.getElementById('admin-error-back');
        if (back) back.onclick = () => { adminSelectedErrorEmail = null; renderAdminPanel(); };
        document.querySelectorAll('[data-admin-error-email]').forEach(b => b.onclick = () => { adminSelectedErrorEmail = b.dataset.adminErrorEmail; renderAdminPanel(); });

function toast(title, desc, type) {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    const bg = type === 'error' ? '#e45a43' : type === 'success' ? '#1e2d3b' : '#4b85a1';
    const icon = type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle-2' : 'info';
    el.style.cssText = `position:fixed;right:18px;top:18px;z-index:120;max-width:360px;padding:14px 18px;border-radius:12px;color:#fff;background:${bg};box-shadow:0 15px 40px #1e2d3b2e;font-size:12px;font-weight:700;animation:slideUp .25s ease;display:flex;align-items:center;gap:10px`;
    el.innerHTML = `<i data-lucide="${icon}" style="width:20px;height:20px;flex-shrink:0"></i><div><b>${title}</b><br><span style="font-size:10px;opacity:.8">${desc}</span></div>`;
    root.appendChild(el);
    lucide.createIcons();
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3200);
}
window.toast = toast;
window.goToPage = function(p) { page = p; render(); };

function addLog(type, status, message, metadata) {
    logs = [{ id: id(), createdAt: new Date().toISOString(), type, status, message, metadata }, ...logs].slice(0, 200);
    save(KEYS.logs, logs);
}

async function syncPending() {
    if (!navigator.onLine) return;
    let out = load(KEYS.outbox, []);
    for (const item of out) {
        try {
            const remote = await client.verifierChassis(item.vin);
            if (remote) {
                out = out.filter(x => x.id !== item.id);
                save(KEYS.outbox, out);
                addLog('Recherche via N° Châssis ' + item.vin, 'success', 'Recherche synchronisée.', { vin: item.vin });
            }
        } catch(e) { break; }
    }
}

window.addEventListener('online', () => { syncPending(); });
setInterval(syncPending, 60000);

function wireLogin() {
    const form = document.getElementById('login-form');
    if (!form) return;
    form.onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const submit = document.getElementById('login-submit');
        wireAuthError('login-error', '');
        if (!email || !password) {
            wireAuthError('login-error', 'Renseignez votre e-mail et votre mot de passe.');
            return;
        }
        submit.disabled = true;
        submit.innerHTML = '<span class="loading-spinner"></span> Connexion…';
        try {
            await AuthAPI.login(email, password);
            toast('Connexion réussie', 'Bienvenue sur Oracle.', 'success');
            enterApp();
        } catch (err) {
            wireAuthError('login-error', err.message || 'Identifiants incorrects.');
        } finally {
            submit.disabled = false;
            submit.innerHTML = '<i data-lucide="log-in"></i> Se connecter';
            lucide.createIcons();
        }
    };
}

function wireRegister() {
    const form = document.getElementById('register-form');
    if (!form) return;

    const pwdInput = document.getElementById('reg-password');
    const confirmInput = document.getElementById('reg-confirm');
    const pwdWrap = document.getElementById('reg-password-wrap');
    const confirmWrap = document.getElementById('reg-confirm-wrap');
    const pwdHint = document.getElementById('reg-password-hint');
    const confirmHint = document.getElementById('reg-confirm-hint');

    // Validation en direct : conformité du mot de passe (8 caractères
    // minimum) et concordance avec sa confirmation, mise à jour à chaque
    // frappe sur l'un ou l'autre champ.
    const checkPasswords = () => {
        const pwd = pwdInput.value;
        const confirm = confirmInput.value;

        const pwdValid = pwd.length >= 8;
        pwdWrap.classList.toggle('valid', pwdValid);
        pwdHint.innerHTML = pwd.length === 0
            ? 'Au moins 8 caractères'
            : pwdValid
                ? '<span class="ready"><i data-lucide="check-circle-2" style="width:12px;height:12px;display:inline"></i> Mot de passe conforme</span>'
                : `<span style="color:var(--red)">${8 - pwd.length} caractère${8 - pwd.length > 1 ? 's' : ''} manquant${8 - pwd.length > 1 ? 's' : ''}</span>`;

        const confirmMatches = confirm.length > 0 && confirm === pwd;
        const confirmMismatch = confirm.length > 0 && confirm !== pwd;
        confirmWrap.classList.toggle('valid', confirmMatches);
        confirmHint.innerHTML = confirm.length === 0
            ? ''
            : confirmMatches
                ? '<span class="ready"><i data-lucide="check-circle-2" style="width:12px;height:12px;display:inline"></i> Les mots de passe correspondent</span>'
                : '<span style="color:var(--red)">Les mots de passe ne correspondent pas</span>';

        lucide.createIcons();
    };
    pwdInput.oninput = checkPasswords;
    confirmInput.oninput = checkPasswords;

    form.onsubmit = async (e) => {
        e.preventDefault();
        const nom = document.getElementById('reg-nom').value.trim();
        const prenoms = document.getElementById('reg-prenoms').value.trim();
        const matricule = document.getElementById('reg-matricule').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm').value;
        const acceptedCgu = document.getElementById('reg-cgu').checked;
        const submit = document.getElementById('register-submit');
        wireAuthError('register-error', '');

        if (!nom || !prenoms || !matricule || !email || !password) {
            wireAuthError('register-error', 'Tous les champs sont obligatoires.');
            return;
        }
        if (password.length < 8) {
            wireAuthError('register-error', 'Le mot de passe doit contenir au moins 8 caractères.');
            return;
        }
        if (password !== confirmPassword) {
            wireAuthError('register-error', 'La confirmation du mot de passe ne correspond pas.');
            return;
        }
        if (!acceptedCgu) {
            wireAuthError('register-error', 'Vous devez accepter les Conditions Générales d\'Utilisation.');
            return;
        }

        submit.disabled = true;
        submit.innerHTML = '<span class="loading-spinner"></span> Création…';
        try {
            await AuthAPI.register({ nom, prenoms, matricule, email, password, confirmPassword, acceptedCgu });
            toast('Compte créé', 'Bienvenue sur Oracle.', 'success');
            enterApp();
        } catch (err) {
            wireAuthError('register-error', err.message || 'Impossible de créer le compte.');
        } finally {
            submit.disabled = false;
            submit.innerHTML = '<i data-lucide="user-plus"></i> Créer mon compte';
            lucide.createIcons();
        }
    };
}

function render() {
    const authPages = ['login', 'register'];
    document.body.classList.toggle('auth-mode', authPages.includes(page));

    if (authPages.includes(page)) {
        const content = document.getElementById('content');
        content.innerHTML = page === 'login' ? renderLogin() : renderRegister();
        if (page === 'login') wireLogin(); else wireRegister();
        lucide.createIcons();
        return;
    }

    renderChrome();
    const content = document.getElementById('content');
    const adminOnlyPages = ['logs', 'errors', 'admin-users'];
    if (adminOnlyPages.includes(page) && !(window.AuthAPI && AuthAPI.isAdmin())) {
        page = 'home';
    }
    switch(page) {
        case 'home': content.innerHTML = renderHome(); break;
        case 'search': content.innerHTML = renderSearch(); break;
        case 'history': content.innerHTML = renderHistory(); break;
        case 'positions':
            adminMapSelection = 'self';
            mapDataSource = null;
            content.innerHTML = renderPositions();
            break;
        case 'logs': content.innerHTML = renderLogs(); break;
        case 'errors': content.innerHTML = renderErrors(); break;
        case 'guide': content.innerHTML = renderGuide(); break;
        case 'about': content.innerHTML = renderAbout(); break;
        case 'admin-users': content.innerHTML = renderAdminUsersShell(); loadAdminUsersData(); break;
        default: content.innerHTML = '<div class="empty"><h3>Page introuvable</h3></div>';
    }
    wire();
    if (page === 'positions') {
        setTimeout(renderMap, 20);
        if (window.AuthAPI && AuthAPI.isAdmin()) setTimeout(loadAdminPositionsSelector, 20);
    }
    if (page === 'home') {
        maybeShowInstallInvite();

    document.getElementById('crumb-page').textContent = pages[page] || 'Accueil';
}

// ================================================================
// REGISTRE LOCAL D'IMMATRICULATIONS — cache JSON indexé (VIN + plaque)
// ================================================================
// Remplace l'ancien chargement CSV. Le fichier distant
// /data/Immatriculations.json est chargé une seule fois par session,
// mis en cache dans localStorage (avec l'ETag renvoyé par le serveur
// pour éviter de le retélécharger inutilement), et reste utilisable
// hors ligne. Chaque châssis peut avoir plusieurs fiches (propriétaires
// successifs après revente) : on les regroupe et on garde la plus
// récente comme "actuelle", les autres comme "anciens propriétaires" —
// exactement la même logique que pour les propriétaires successifs.

const IMMAT_CACHE_KEY = 'oracle_immatriculations_cache_v1';
const IMMAT_PENDING_KEY = 'oracle_immatriculations_pending_sync_v1';

let immatCache = null; // { etag, records: [...] }
let chassisIndex = new Map();
let plateIndex = new Map();

function normalizeVin2(v) { return String(v || '').replace(/\s/g, '').toUpperCase(); }
function normalizePlateKey(v) {
    const stripped = normalizePlateInput(v);
    const m = stripped.match(PLATE_CORE_RE);
    return m ? m[1] + 'RB' : stripped;
}
function normalizeOwnerName(n) { return String(n || '').trim().toUpperCase().replace(/\s+/g, ' '); }

function rebuildImmatIndexes() {
    chassisIndex = new Map();
    plateIndex = new Map();
    if (!immatCache || !Array.isArray(immatCache.records)) return;
    immatCache.records.forEach(r => {
        const vin = normalizeVin2(r['châssis'] || r['chassis'] || '');
        const plate = normalizePlateKey(r['immatriculation'] || '');
        if (vin) { if (!chassisIndex.has(vin)) chassisIndex.set(vin, []); chassisIndex.get(vin).push(r); }
        if (plate) { if (!plateIndex.has(plate)) plateIndex.set(plate, []); plateIndex.get(plate).push(r); }
    });
}

function persistImmatCache() {
    try { localStorage.setItem(IMMAT_CACHE_KEY, JSON.stringify(immatCache)); } catch (e) {}
}

// Fusion : distant + entrées locales pas encore confirmées par le
// serveur (marquées __localOnly). Évite qu'un rafraîchissement écrase
// une découverte qui n'a pas encore été synchronisée.
function mergeImmatCache(oldCache, fresh) {
    const localOnly = ((oldCache && oldCache.records) || []).filter(r => r.__localOnly);
    return { etag: fresh.etag, records: [...fresh.records, ...localOnly] };
}

/**
 * Charge le registre : cache localStorage d'abord (affichage/racherche
 * immédiats, y compris hors ligne), puis tentative de rafraîchissement
 * réseau via ETag (aucun retéléchargement si rien n'a changé).
 */
async function loadImmatCache() {
    if (!immatCache) {
        try {
            const raw = localStorage.getItem(IMMAT_CACHE_KEY);
            if (raw) { immatCache = JSON.parse(raw); rebuildImmatIndexes(); }
        } catch (e) {}
    }
    if (!navigator.onLine && immatCache) return immatCache;

    try {
        const headers = {};
        if (immatCache && immatCache.etag) headers['If-None-Match'] = immatCache.etag;
        const resp = await fetch('/data/Immatriculations.json', { cache: 'no-store', headers });
        if (resp.status === 304 && immatCache) return immatCache;
        if (!resp.ok) throw new Error('Registre des immatriculations indisponible.');
        const records = await resp.json();
        const etag = resp.headers.get('ETag') || resp.headers.get('Last-Modified') || String(Date.now());
        immatCache = mergeImmatCache(immatCache, { etag, records: Array.isArray(records) ? records : [] });
        rebuildImmatIndexes();
        persistImmatCache();
    } catch (e) {
        if (!immatCache) immatCache = { etag: null, records: [] };
    }
    return immatCache;
}

/**
 * Résout une clé (VIN ou plaque) dans le cache local. Regroupe toutes
 * les fiches partageant la même clé, la plus récente devient
 * "current", les autres "previousOwners" — même contrat que le parse()
 * du service de vérification, donc branchable directement sur showPreviousOwners().
 */
function resolveFromCache(key, type) {
    if (!chassisIndex.size && !plateIndex.size) return null;
    const index = type === 'vin' ? chassisIndex : plateIndex;
    const normalized = type === 'vin' ? normalizeVin2(key) : normalizePlateKey(key);
    const matches = (index.get(normalized) || []).slice()
        .sort((a, b) => new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0));
    if (!matches.length) return null;
    const [current, ...previousOwners] = matches;
    return { current, previousOwners };
}

function mapCachedRecordToResult(r) {
    return {
        owner: r['nom et prénom'] || 'Propriétaire non spécifié',
        plate: r['immatriculation'] || '',
        department: r['département'] || r['departement'] || '',
        vin: r['châssis'] || r['chassis'] || ''
    };
}

// ---- File d'attente hors ligne + synchronisation des découvertes ----

function queueImmatSync(payload) {
    const pending = load(IMMAT_PENDING_KEY, []);
    pending.push({ id: 'SYNC-' + Date.now().toString(36).toUpperCase(), record: payload, createdAt: new Date().toISOString(), attempts: 0 });
    save(IMMAT_PENDING_KEY, pending);
}

async function syncPendingImmatriculations() {
    if (!navigator.onLine || !window.AuthAPI || !AuthAPI.isAuthenticated()) return;
    let pending = load(IMMAT_PENDING_KEY, []);
    if (!pending.length) return;
    const MAX_ATTEMPTS = 5;
    const remaining = [];
    for (const item of pending) {
        if ((item.attempts || 0) >= MAX_ATTEMPTS) continue; // abandon silencieux au-delà de 5 essais
        try {
            await AuthAPI.syncImmatriculation(item.record);
        } catch (e) {
            item.attempts = (item.attempts || 0) + 1;
            remaining.push(item);
            continue;
        }
    }
    save(IMMAT_PENDING_KEY, remaining);
}
window.addEventListener('online', () => { syncPendingImmatriculations(); loadImmatCache(); });

/**
 * Appelée après une recherche par châssis ABOUTIE en ligne (pas
 * depuis le cache) : vérifie si ce véhicule/propriétaire est déjà connu
 * du registre local, sinon l'ajoute (nouvelle ligne = revente détectée
 * si le châssis existait déjà avec un autre propriétaire).
 */
async function maybeRegisterDiscovery(record) {
    if (record.status !== 'found' || record.fromCache || !record.vin) return;
    if (!immatCache) await loadImmatCache();

    const group = chassisIndex.get(normalizeVin2(record.vin)) || [];
    const already = group.some(r => normalizeOwnerName(r['nom et prénom']) === normalizeOwnerName(record.owner));
    if (already) return;

    const payload = {
        'nom et prénom': record.owner || '',
        immatriculation: record.plate || '',
        'département': record.department || '',
        'châssis': record.vin || '',
        statut: 'OK',
        source: 'direct'
    };

    const localEntry = { ...payload, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), __localOnly: true };
    immatCache.records = [localEntry, ...(immatCache.records || [])];
    rebuildImmatIndexes();
    persistImmatCache();

    if (!navigator.onLine || !window.AuthAPI || !AuthAPI.isAuthenticated()) {
        queueImmatSync(payload);
        return;
    }
    try {
        await AuthAPI.syncImmatriculation(payload);
        localEntry.__localOnly = false;
        persistImmatCache();
    } catch (e) {
        addLog('Synchronisation immatriculation', 'error', e.message || 'Erreur inconnue', { plaque: payload.immatriculation, vin: payload['châssis'] });
        queueImmatSync(payload);
    }
}

async function runImmatSearch(value) {
    const raw = String(value || '').trim();
    const normalized = completePlate(raw) || normalizePlateInput(raw);
    const dedicatedSubmit = document.getElementById('immat-submit');
    const submit = dedicatedSubmit || document.getElementById('home-search-btn');
    const isHomeContext = !dedicatedSubmit;
    const resultBox = getActiveResultBox();
    if (!raw) { toast('Immatriculation invalide', 'Saisissez un numéro d’immatriculation.', 'error'); return; }
    if (submit) { submit.disabled=true; submit.innerHTML = isHomeContext ? '<span class="loading-spinner"></span>' : '<span class="loading-spinner"></span> Recherche…'; }
    try {
        const gps = await captureGpsSilent();
        await loadImmatCache();
        const resolved = resolveFromCache(raw, 'immat');
        // La consultation du registre local est quasi instantanée, mais on
        // simule la même durée que la recherche par châssis (appel réseau
        // réel) pour une expérience cohérente entre les deux modes.
        await new Promise(r => setTimeout(r, 9000 + Math.random() * 2000));
        const data = resolved
            ? { status:'found', ...mapCachedRecordToResult(resolved.current), fromCache: true, message:'Correspondance trouvée dans le registre local.', previousOwners: resolved.previousOwners.map(p => ({ ...mapCachedRecordToResult(p) })) }
            : { status:'not_found', message:'Aucune donnée trouvée pour cette immatriculation.' };
        const record = {
            ...data,
            id: id(),
            searchType: 'immatriculation',
            searchKey: normalized,
            immatriculation: normalized,
            vin: data.vin || '',
            searchedAt: new Date().toISOString(),
            latitude: gps.latitude,
            longitude: gps.longitude,
            accuracy: gps.accuracy,
            samples: gps.samples || 0
        };
        history=[record,...history]; save(KEYS.history,history);
        if (window.AuthAPI) window.AuthAPI.syncSearch(record);
        addLog('Recherche via immatriculation ' + normalized, resolved?'success':'warning', resolved?'Immatriculation identifiée':'Immatriculation non trouvée', {immatriculation:normalized});
        if(resultBox) { resultBox.innerHTML=buildResult(record); lucide.createIcons(); scrollToResultCard(); }
        clearActiveSearchInputs();

        toast(resolved?'Immatriculation identifiée':'Recherche enregistrée', resolved?'Correspondance trouvée dans le registre local.':'Aucun enregistrement trouvé.', resolved?'success':'info');
    } catch(error) {
        addLog('Recherche via immatriculation ' + normalized, 'error', error.message, {immatriculation:normalized});
        toast('Erreur',error.message,'error');
    }
    finally {
        if (submit) {
            submit.innerHTML = isHomeContext ? '<i data-lucide="search" style="width:20px;height:20px"></i>' : '<i data-lucide="search"></i> Rechercher';
            const inputEl = document.getElementById(isHomeContext ? 'home-vin' : 'immat-input');
            const val = inputEl ? inputEl.value : '';
            submit.disabled = isHomeContext ? !(isValidVin(val) || !!completePlate(val)) : !completePlate(val);
            lucide.createIcons();
        }
    }
}

window.recenterMap = function recenterMap() {
    if (!leafletMap || !leafletMarkers.length) return;
    if (leafletMarkers.length === 1) {
        leafletMap.setView(leafletMarkers[0].getLatLng(), 15);
    } else {
        const bounds = L.latLngBounds(leafletMarkers.map(m => m.getLatLng()));
        leafletMap.fitBounds(bounds, { padding: [40, 40] });
    }
};

function wire() {
    document.querySelectorAll('[data-page]').forEach(b => b.onclick = () => {
        page = b.dataset.page;
        render();
        closeDrawer();
    });

    if (page === 'search') {
        const tabImmat=document.getElementById('tab-immat'), tabVin=document.getElementById('tab-vin');
        const panelImmat=document.getElementById('panel-immat'), panelVin=document.getElementById('panel-vin');
        const immatInput=document.getElementById('immat-input'), immatForm=document.getElementById('form-immat'), immatSubmit=document.getElementById('immat-submit');
        const vinInput=document.getElementById('vin'), vinForm=document.getElementById('form-vin'), submit=document.getElementById('search-submit');

        const activate = mode => {
            const immat=mode==='immat';
            tabImmat.classList.toggle('active',immat); tabVin.classList.toggle('active',!immat);
            tabImmat.setAttribute('aria-selected',immat); tabVin.setAttribute('aria-selected',!immat);
            panelImmat.classList.toggle('active',immat); panelVin.classList.toggle('active',!immat);
            setTimeout(()=>(immat?immatInput:vinInput).focus(),50);
        };
        tabImmat.onclick=()=>activate('immat'); tabVin.onclick=()=>activate('vin');

        // Comportement du bouton immatriculation IDENTIQUE au bouton
        // châssis : désactivé tant que le format n'est pas valide.
        immatInput.oninput = () => {
            const raw = immatInput.value.toUpperCase();
            immatInput.value = raw;
            const wrap = immatInput.closest('.oracle-input-wrap');
            const plate = completePlate(raw);
            const ready = !!plate;
            immatSubmit.disabled = !ready;
            wrap.classList.toggle('valid', ready);
            const locked = endsWithRB(raw) && ready;
            wrap.classList.toggle('locked', locked);
            immatInput.readOnly = locked;
            document.getElementById('immat-ready').innerHTML = ready
                ? '<span class="ready"><i data-lucide="check-circle-2" style="width:12px;height:12px;display:inline"></i> Prêt à rechercher</span>'
                : '';
            lucide.createIcons();
        };
        immatInput.onkeydown = e => { if (e.key === 'Enter' && !immatSubmit.disabled) immatForm.requestSubmit(); };
        immatForm.onsubmit = e => { e.preventDefault(); runImmatSearch(immatInput.value); };

        if (vinInput) {
            vinInput.oninput = () => {
                vinInput.value = vinInput.value.replace(/\s/g, '').toUpperCase().slice(0, 17);
                document.getElementById('vin-count').textContent = vinInput.value.length;
                submit.disabled = vinInput.value.length < 15 || vinInput.value.length > 17;
                vinInput.closest('.oracle-input-wrap').classList.toggle('valid', vinInput.value.length >= 15);
            };
            vinInput.onkeydown = e => { if (e.key === 'Enter' && !submit.disabled) vinForm.requestSubmit(); };
        }
        if (vinForm) vinForm.onsubmit = e => { e.preventDefault(); runSearch(vinInput.value); };
    }
    if (page === 'home') {
        const input = document.getElementById('home-vin');
        const btn = document.getElementById('home-search-btn');
        if (input && btn) {
            const update = () => {
                let val = input.value.toUpperCase();
                const plate = completePlate(val);
                const locked = endsWithRB(val) && !!plate;
                input.readOnly = locked;
                input.classList.toggle('locked', locked);
                val = val.replace(/\s/g, '').length > 17 && !plate ? val.slice(0, 17) : val;
                input.value = val;
                btn.disabled = !(isValidVin(val) || !!plate);
            };
            input.oninput = update;
            input.onkeydown = e => { if (e.key === 'Enter' && !btn.disabled) runSearchFromHome(); };
            btn.onclick = runSearchFromHome;
        }
    }
}

    d.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px">
            <div class="brand"><div class="brand-mark"><i data-lucide="compass" style="width:22px;height:22px"></i></div><div><strong>oracle</strong><small>terrain intelligence</small></div></div>
            <button class="icon-btn" id="close-drawer" style="color:#dfe5e6"><i data-lucide="panel-right-close" style="width:20px;height:20px"></i></button>
        </div>
        <p style="color:#f2a06e;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin:0 0 16px">Espace agent</p>
        <nav style="display:grid;gap:4px">
            ${items.map(x => `
                <button data-page="${x[0]}" style="display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:0;border-radius:10px;color:#aeb8be;background:transparent;text-align:left;font-size:12px;font-weight:700;transition:.15s">
                    <i data-lucide="${x[1]}" style="width:18px;height:18px"></i>
                    ${x[2]}
                    ${x[0] === 'errors' && logs.filter(l => l.status === 'error').length ? `<span style="margin-left:auto;background:var(--red);color:#fff;font-size:8px;padding:1px 6px;border-radius:99px">${logs.filter(l => l.status === 'error').length}</span>` : ''}
                </button>
            `).join('')}
            ${canInstall() ? `<button data-install style="display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:0;border-radius:10px;color:#f3ad7c;background:#e8783f1a;text-align:left;font-size:12px;font-weight:700">
                    <i data-lucide="download" style="width:18px;height:18px"></i> Installer Oracle
                </button>` : ''}
            <button onclick="window.oracleLogout()" style="display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:0;border-radius:10px;color:#f3a29e;background:transparent;text-align:left;font-size:12px;font-weight:700">
                <i data-lucide="log-out" style="width:18px;height:18px"></i> Se déconnecter
            </button>
        </nav>
        <div style="margin-top:auto;padding-top:20px;border-top:1px solid #ffffff1c;display:flex;align-items:center;gap:10px">
            <i data-lucide="shield-check" style="width:18px;height:18px"></i>
            <div><b style="font-size:10px;display:block">Données privées</b><span style="color:#9daab0;font-size:8px">Stockées uniquement sur cet appareil</span></div>
        </div>
    `;
    d.style.transform = 'translateX(0)';
    document.getElementById('drawer-backdrop').style.visibility = 'visible';
    document.getElementById('drawer-backdrop').style.opacity = '1';
    document.getElementById('close-drawer').onclick = closeDrawer;
    document.querySelectorAll('#drawer [data-page]').forEach(b => b.onclick = () => { page = b.dataset.page; render(); closeDrawer(); });
    lucide.createIcons();
}


function closeDrawer() {
    document.getElementById('drawer').style.transform = 'translateX(100%)';
    document.getElementById('drawer-backdrop').style.opacity = '0';
    document.getElementById('drawer-backdrop').style.visibility = 'hidden';
}

document.getElementById('open-drawer').onclick = openDrawer;
document.getElementById('drawer-backdrop').onclick = closeDrawer;

document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-install]');
    if (b) {
        e.preventDefault();
        window.triggerInstall();
        closeDrawer();
    }
});

if (window.AuthAPI && AuthAPI.isAuthenticated()) {
    if (permission !== 'granted') {
        renderPermission(null);
    } else {
        startGpsBackground();
        render();
    }
    if (permission === 'granted') {
        document.getElementById('permission-root').innerHTML = '';
    }
    // Chargement du registre d'immatriculations en tâche de fond, dès le
    // démarrage — la première recherche n'a donc plus à attendre le
    // téléchargement, et le mode hors ligne est prêt immédiatement.
    loadImmatCache();
    syncPendingImmatriculations();
} else {
    page = 'login';
    render();
}

window.onerror = (msg, url, line) => {
    console.error('Oracle error:', msg, url, line);
    addLog('Erreur globale', 'error', msg || 'Erreur inconnue', { url, line });
    const isAuth = window.AuthAPI && AuthAPI.isAuthenticated();
    toast('Erreur', isAuth ? 'Une erreur inattendue est survenue. Consultez l\'onglet Erreurs.' : 'Une erreur inattendue est survenue. Réessayez.', 'error');
};

console.log('📍 Oracle v6.5 — recherche unifiée immat/châssis');
console.log(`📋 ${history.length} recherches, ${logs.length} logs`);

})();
</script>
</body>
</html>
