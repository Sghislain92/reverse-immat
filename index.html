<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oracle — Extraction ANaTT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans">
  <header class="border-b border-slate-200 bg-white"><div class="mx-auto max-w-5xl px-4 py-4 flex items-center gap-3"><div class="flex h-10 w-10 items-center justify-center rounded-lg bg-teal-700 text-white"><i data-lucide="shield-check"></i></div><div><h1 class="text-lg font-bold text-slate-900">Oracle</h1><p class="text-xs text-slate-500">Extraction des certificats ANaTT</p></div></div></header>
  <main class="mx-auto max-w-5xl space-y-4 px-4 py-8">
    <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="font-semibold text-slate-900">Extraction par intervalle</h2>
      <p class="mt-1 text-sm text-slate-500">Les PDF sont téléchargés en parallèle avec une concurrence limitée. Les résultats sont sauvegardés après chaque certificat.</p>
      <form id="batch-form" class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-[1fr_1fr_120px_auto] sm:items-end">
        <label class="text-xs font-medium text-slate-600">Début<input id="start-num" type="number" min="1" required placeholder="537" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-mono outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-100"></label>
        <label class="text-xs font-medium text-slate-600">Fin<input id="end-num" type="number" min="1" required placeholder="1200" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-mono outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-100"></label>
        <label class="text-xs font-medium text-slate-600">Parallèle<input id="concurrency" type="number" min="1" max="8" value="5" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-mono outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-100"></label>
        <button id="batch-btn" class="inline-flex items-center justify-center gap-2 rounded-lg bg-teal-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-teal-800 disabled:opacity-60"><i data-lucide="play" class="h-4 w-4"></i><span>Lancer</span></button>
      </form>
      <div class="mt-4 rounded-lg bg-slate-50 p-3 text-xs text-slate-600"><label class="font-medium">Endpoint proxy</label><input id="proxy" value="/api/proxy?url=" class="mt-1 w-full rounded-md border border-slate-300 bg-white px-2.5 py-1.5 font-mono"><p class="mt-1">Le proxy doit retourner le PDF en réponse binaire pour l’URL <code>/telechargement/{numero}</code>.</p></div>
    </section>
    <div id="status" class="hidden rounded-lg border px-4 py-3 text-sm"></div>
    <section id="progress" class="hidden rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"></section>
    <section id="diagnostics" class="hidden rounded-2xl border border-slate-200 bg-white shadow-sm"></section>
  </main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const KEYS = { state:'oracle_batch_state_v3', results:'oracle_batch_results_v3' };
const ANATT_BASE = 'https://www.moto.anatt.bj';
let state = null;
let results = {};
let running = false;
let autoExported = false;

function load(key, fallback) { try { const v=localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; } }
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) { console.warn('localStorage indisponible', e); } }
function setStatus(type, message) {
  const colors={loading:'border-teal-200 bg-teal-50 text-teal-800',success:'border-green-200 bg-green-50 text-green-800',warning:'border-amber-200 bg-amber-50 text-amber-800',error:'border-red-200 bg-red-50 text-red-800'};
  $('status').className='rounded-lg border px-4 py-3 text-sm '+(colors[type]||colors.loading); $('status').textContent=message;
}
function normalizeText(v) { return String(v??'').replace(/\s+/g,' ').trim(); }
function escapeHtml(v) { return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function extractLinesFromPage(content) {
  const groups = new Map();
  for (const item of content.items || []) {
    const text=normalizeText(item.str); if (!text) continue;
    const y=Math.round(item.transform[5]);
    if (!groups.has(y)) groups.set(y,[]);
    groups.get(y).push(item);
  }
  return [...groups.entries()].sort((a,b)=>b[0]-a[0]).map(([,items])=>items.sort((a,b)=>a.transform[4]-b.transform[4]).map(x=>x.str).join(' ')).map(normalizeText).filter(Boolean);
}
async function extractPdfLines(buffer) {
  const pdf=await pdfjsLib.getDocument({data:buffer}).promise;
  const lines=[];
  for(let pageNo=1; pageNo<=pdf.numPages; pageNo++) lines.push(...extractLinesFromPage(await pdf.getPage(pageNo)));
  return {lines, pages:pdf.numPages};
}
function valueAfter(lines, patterns, stopPatterns=[]) {
  const label=new RegExp(patterns,'i');
  for(let i=0;i<lines.length;i++) {
    if(!label.test(lines[i])) continue;
    const same=normalizeText(lines[i].replace(label,'')).replace(/^[:\-–]\s*/,'');
    if(same && !stopPatterns.some(p=>new RegExp(p,'i').test(same))) return same;
    for(let j=i+1;j<Math.min(lines.length,i+4);j++) {
      const next=normalizeText(lines[j]); if(!next) continue;
      if(stopPatterns.some(p=>new RegExp(p,'i').test(next))) break;
      return next;
    }
  }
  return '';
}
function parseCertificate(lines, number) {
  const text=lines.join('\n');
  let owner='';
  for(let i=0;i<lines.length;i++) if(/propri[ée]taire du v[ée]hicule/i.test(lines[i])) { for(let j=i-1;j>=0;j--) { const candidate=normalizeText(lines[j]).replace(/^(M\.?|Mme\.?|Mlle\.?)\s*/i,''); if(candidate && !/^certificat|^agence|^r[ée]publique/i.test(candidate)) { owner=candidate; break; } } break; }
  const chassis=valueAfter(lines,'num[ée]ro\s+ch[aâ]ssis\s+est', ['r[ée]f[ée]renc','matricule','annexe']);
  const immatriculation=valueAfter(lines,'sous\s+le\s+matricule', ['annexe','pour\s+le']);
  const depMatch=text.match(/annexe\s+de\s+([A-ZÉÈÀÂÊÎÔÛÇ][A-ZÉÈÀÂÊÎÔÛÇ '\u2019\-]{1,60})/i);
  const departement=depMatch ? normalizeText(depMatch[1].replace(/\s+pour\b[\s\S]*/i,'')) : valueAfter(lines,'annexe\s+de', ['pour\s+le']);
  const certMatch=text.match(/N[°ºo]\s*(\d{2,})/i);
  const data={numero:Number(certMatch?.[1]||number),nomPrenom:owner,immatriculation,departement,chassis,status:'OK'};
  const missing=['nomPrenom','immatriculation','departement','chassis'].filter(k=>!data[k]);
  return {data, diagnostic:{numero:Number(number),fieldsFound:{nomPrenom:!!owner,immatriculation:!!immatriculation,departement:!!departement,chassis:!!chassis},missingFields:missing,linesExtracted:lines.length,textPreview:text.slice(0,1000)}};
}
async function fetchPdf(number) {
  const proxy=$('proxy').value.trim(); if(!proxy) throw Object.assign(new Error('Endpoint proxy vide'),{kind:'CONFIG'});
  const target=`${ANATT_BASE}/telechargement/${number}`;
  const response=await fetch(proxy+encodeURIComponent(target),{headers:{Accept:'application/pdf'},cache:'no-store'});
  const contentType=response.headers.get('content-type')||'';
  const buffer=await response.arrayBuffer();
  if(!response.ok) throw Object.assign(new Error(`HTTP ${response.status}`),{kind:'HTTP',httpStatus:response.status,contentType,size:buffer.byteLength});
  if(buffer.byteLength<100) throw Object.assign(new Error('Réponse PDF trop petite'),{kind:'INVALID_RESPONSE',contentType,size:buffer.byteLength});
  return {buffer,contentType,size:buffer.byteLength};
}
async function processOne(number) {
  const started=Date.now(); let last;
  for(let attempt=1;attempt<=3;attempt++) {
    try {
      const pdf=await fetchPdf(number); const extracted=await extractPdfLines(pdf.buffer); const parsed=parseCertificate(extracted.lines,number);
      return { ...parsed.data, diagnostic:{...parsed.diagnostic, attempts:attempt,httpStatus:200,contentType:pdf.contentType,pdfBytes:pdf.size,pages:extracted.pages,durationMs:Date.now()-started,status:'OK'} };
    } catch(error) {
      last=error; if(attempt<3) await new Promise(r=>setTimeout(r,700*attempt));
      else return {numero:Number(number),status:'ERROR',diagnostic:{numero:Number(number),status:'ERROR',errorType:error.kind||'EXTRACTION',errorMessage:error.message,attempts:attempt,httpStatus:error.httpStatus||null,contentType:error.contentType||null,pdfBytes:error.size||0,durationMs:Date.now()-started}};
    }
  }
  return {numero:Number(number),status:'ERROR',diagnostic:{numero:Number(number),status:'ERROR',errorMessage:last?.message||'Erreur inconnue'}};
}
function completedCount() { return Object.keys(results).length; }
function successfulRecords() { return Object.values(results).filter(r=>r.status==='OK' && (r.nomPrenom||r.immatriculation||r.departement||r.chassis)); }
function renderProgress() {
  if(!state) return; const total=state.end-state.start+1, done=completedCount(), ok=successfulRecords().length, errors=Object.values(results).filter(r=>r.status==='ERROR').length;
  $('progress').className='rounded-2xl border border-slate-200 bg-white p-6 shadow-sm'; $('progress').innerHTML=`<div class="flex flex-wrap items-center justify-between gap-3"><div><h3 class="font-semibold text-slate-900">${state.finished?'Extraction terminée':'Extraction en cours'}</h3><p class="mt-1 text-sm text-slate-500">${done} / ${total} certificats traités · ${ok} données exploitables · ${errors} erreurs</p></div><div class="flex gap-2">${state.finished?'<button id="download-json" class="rounded-lg bg-teal-700 px-4 py-2 text-sm font-semibold text-white">Télécharger le JSON</button>':''}<button id="clear-batch" class="rounded-lg border border-slate-300 px-4 py-2 text-sm">Effacer</button></div></div><div class="mt-4 h-2 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full bg-teal-600 transition-all" style="width:${Math.round(done/total*100)}%"></div></div><p class="mt-3 text-xs text-slate-500">${state.finished?'Le téléchargement JSON a été lancé automatiquement.':'Les résultats sont conservés automatiquement dans ce navigateur.'}</p>`;
  $('download-json')?.addEventListener('click',()=>downloadJson(false)); $('clear-batch')?.addEventListener('click',clearBatch);
}
function renderDiagnostics() {
  const all=Object.values(results).filter(r=>r.diagnostic?.status==='ERROR' || r.diagnostic?.missingFields?.length);
  if(!all.length){$('diagnostics').className='hidden';return;}
  $('diagnostics').className='rounded-2xl border border-slate-200 bg-white shadow-sm'; $('diagnostics').innerHTML=`<details><summary class="cursor-pointer px-6 py-4 text-sm font-semibold">Diagnostics (${all.length})</summary><div class="max-h-96 overflow-auto border-t border-slate-100"><table class="w-full text-left text-xs"><thead class="bg-slate-50 text-slate-500"><tr><th class="px-4 py-2">N°</th><th class="px-4 py-2">Statut</th><th class="px-4 py-2">Lignes</th><th class="px-4 py-2">Champs manquants / erreur</th></tr></thead><tbody>${all.map(r=>`<tr class="border-t border-slate-100"><td class="px-4 py-2 font-mono">${r.numero}</td><td class="px-4 py-2">${r.diagnostic.status||'PARSING'}</td><td class="px-4 py-2">${r.diagnostic.linesExtracted??'—'}</td><td class="px-4 py-2">${escapeHtml((r.diagnostic.missingFields||[]).join(', ')||r.diagnostic.errorMessage||'—')}</td></tr>`).join('')}</tbody></table></div></details>`;
}
function downloadJson(manual) {
  const records=successfulRecords().map(r=>{const {diagnostic,...data}=r;return data;});
  const payload={version:1,source:'ANaTT',range:{start:state.start,end:state.end},exportedAt:new Date().toISOString(),records};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`certificats-${state.start}-${state.end}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); if(manual)setStatus('success',`${records.length} lignes JSON téléchargées.`);
}
function saveState() { save(KEYS.state,state); save(KEYS.results,results); }
function clearBatch() { state=null; results={}; localStorage.removeItem(KEYS.state); localStorage.removeItem(KEYS.results); $('progress').className='hidden'; $('diagnostics').className='hidden'; setStatus('warning','Extraction locale effacée.'); }
async function runBatch(numbers,concurrency) {
  running=true; $('batch-btn').disabled=true; $('batch-btn').querySelector('span').textContent='Extraction…';
  let cursor=0; const total=state.end-state.start+1; const worker=async()=>{ while(true){ const number=numbers[cursor++]; if(number===undefined) return; setStatus('loading',`Téléchargement et analyse du certificat ${number} (${completedCount()+1}/${total})…`); const result=await processOne(number); results[String(number)]=result; saveState(); renderProgress(); renderDiagnostics(); } };
  await Promise.all(Array.from({length:concurrency},worker)); state.finished=true; saveState(); renderProgress(); renderDiagnostics(); setStatus('success',`Extraction terminée : ${successfulRecords().length} résultats exploitables sur ${total}.`); if(!autoExported){autoExported=true; setTimeout(()=>downloadJson(false),250);}
  running=false; $('batch-btn').disabled=false; $('batch-btn').querySelector('span').textContent='Lancer';
}
$('batch-form').addEventListener('submit',async e=>{e.preventDefault();if(running)return; const start=Number($('start-num').value),end=Number($('end-num').value),concurrency=Math.min(8,Math.max(1,Number($('concurrency').value)||5));if(!Number.isInteger(start)||!Number.isInteger(end)||end<start){setStatus('error','Intervalle invalide.');return;} const old=load(KEYS.state,null); if(old&&old.start===start&&old.end===end&&!old.finished){state=old;results=load(KEYS.results,{});setStatus('loading',`Reprise de l’extraction : ${completedCount()} certificat(s) déjà traité(s).`);} else {state={start,end,finished:false,startedAt:new Date().toISOString()};results={};saveState();} renderProgress();renderDiagnostics(); const pending=Array.from({length:end-start+1},(_,i)=>start+i).filter(n=>!results[String(n)]); if(!pending.length){state.finished=true;saveState();renderProgress();downloadJson(false);return;} await runBatch(pending,concurrency);});
(function init(){const saved=load(KEYS.state,null);if(saved){state=saved;results=load(KEYS.results,{});$('start-num').value=saved.start;$('end-num').value=saved.end;renderProgress();renderDiagnostics();if(saved.finished)setStatus('success','Dernière extraction terminée. Le JSON peut être téléchargé à nouveau.');else setStatus('warning',`Extraction interrompue : ${completedCount()} résultat(s) récupéré(s). Relancez le même intervalle pour reprendre.`);}lucide.createIcons();})();
</script>
</body>
</html>
